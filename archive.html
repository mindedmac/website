<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="assets/photo.png">
    <title>Archive</title>

    <style>
        body {
            margin: 25px 0 0;
            background: #fff2e0 center repeat-y;
            text-align: center;
            font-family: "Cambria Math", Cambria, "Times New Roman", serif;
            color: #2B0000;
        }

        #main {
            width: 85%;
            max-width: 1000px;
            margin: 0 auto;
            text-align: left;
            transform: scale(0.85);
            transform-origin: top center;
        }

        #side-container {
            float: left;
            width: 150px;
            margin-right: 20px;
        }

        #navigation {
            width: 150px;
            text-align: left;
        }

        #content {
            width: 820px;
            margin-left: 170px;
            padding: 5px;
        }

        #footer {
            padding: 40px 0 10px;
            clear: left;
            text-align: center;
            font-size: 70%;
            color: #707070;
            font-style: italic;
        }

        h1 {
            margin: 0 0 15px;
            padding-top: 2px;
            color: #B22222;
            font-size: 180%;
            font-weight: normal;
            text-align: right;
            border-bottom: 1px solid #B22222;
        }

        a {
            color: #B22222;
            text-decoration: none;
        }

        a.navigation {
            display: block;
            padding: 3px 0 3px 5px;
            border-left: 5px solid #F5C6C6;
            color: #5A0E0E;
        }

        a.navigation:hover {
            border-color: #B22222;
            background: #FDECEA;
        }

        .placeholder-box {
            border: 1px solid #F5C6C6;
            background: rgba(253, 236, 234, 0.4);
            padding: 24px 22px;
            margin-top: 10px;
            margin-bottom: 18px;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .construction-text {
            font-size: 54px;
            font-weight: bold;
            color: #B22222;
            letter-spacing: 2px;
            line-height: 1.1;
        }

        .muted {
            color: #707070;
        }

        .archive-image {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
            border: 1px solid #d9c7ba;
            margin-bottom: 20px;
        }
    </style>

    <!-- Images and related JS removed for this page -->
</head>

<body>
    <div id="main">
        <!-- Banner removed for this page -->

        <aside id="side-container">
            <a href="index.html"
                style="color:#B22222;text-decoration:underline;font-weight:bold;display:block;margin-bottom:12px;">
                &lt; Home
            </a>

            <nav id="navigation">
                <div style="height: 14px;"></div>
                <a href="#" class="navigation" aria-label="Archive placeholder">Archive</a>
                <a href="#" class="navigation" aria-label="Blank navigation item">&nbsp;</a>
                <a href="#" class="navigation" aria-label="Blank navigation item">&nbsp;</a>
                <a href="#" class="navigation" aria-label="Blank navigation item">&nbsp;</a>
            </nav>
        </aside>

        <main id="content">
            <section>
                <h1><span style="color:black;">Archive</span></h1>

                <div class="placeholder-box">
                    <div class="construction-text">Under Construction</div>
                </div>

                <p class="muted">
                    The archive is being rebuilt. Check back soon for older notes, writing, and project records.
                </p>

                <!-- Decorative image removed for this page -->
            </section>
        </main>

        <div style="clear:both;"></div>

        <footer id="footer">
            Last modified: August 15th, 2026
        </footer>
    </div>
</body>

</html>
