<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="assets/photo.png">
    <title>404 — Mindedmac</title>
    <style>
        body {
            margin: 25px 0 0;
            background: #fff2e0 center repeat-y;
            text-align: center;
            font-family: "Cambria Math", Cambria, "Times New Roman", serif;
            color: #2B0000;
        }

        #main {
            width: min(1200px, calc(100% - 32px));
            margin: 0 auto;
            text-align: left;
        }

        #content {
            width: 100%;
            margin: 0;
            padding: 24px 0 5px;
            overflow: visible;
            text-align: left;
            font-family: "Cambria Math", Cambria, "Times New Roman", serif;
            font-size: 100%;
            color: #2B0000;
        }

        #footer {
            padding: 40px 0 10px;
            clear: both;
            font-family: "Cambria Math", Cambria, "Times New Roman", serif;
            font-size: 70%;
            color: #707070;
            text-align: center;
            font-style: italic;
        }

        h1 {
            margin: 0 0 15px;
            padding-top: 2px;
            color: #B22222;
            font-size: 180%;
            font-weight: normal;
            text-align: right;
            border-bottom: 1px solid #B22222;
        }

        p {
            margin-top: 10px;
            padding-bottom: 10px;
        }

        a,
        a:hover {
            color: #B22222;
            text-decoration: none;
            font-weight: bold;
        }

        .error-box {
            border: 1px solid #F5C6C6;
            background: rgba(253, 236, 234, 0.4);
            padding: 24px 22px;
            margin-top: 10px;
            margin-bottom: 18px;
        }

        .error-code {
            font-size: 72px;
            line-height: 1;
            color: #B22222;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .muted {
            color: #707070;
        }
    </style>
</head>

<body>
    <div id="main">
        <main id="content">
            <section>
                <h1><span style="color:black;">404</span></h1>

                <div class="error-box">
                    <div class="error-code">404</div>
                    <p><strong>Page not found.</strong></p>
                    <p>The page you requested could not be found, moved, or never existed.</p>
                    <p>
                        You can return to the <a href="https://mindedmac.com">homepage</a>
                        or visit the <a href="https://mindedmac.com/archive.html">archive</a>.
                    </p>
                </div>

                <p class="muted">
                    If you followed a link from this site and it is broken, please let me know.
                </p>
            </section>
        </main>

        <div style="clear:both;"></div>

        <footer id="footer">
            Last modified: August 15th, 2026
        </footer>
    </div>
</body>

</html>
